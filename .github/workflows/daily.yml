name: Daily Finance Radar

on:
  schedule:
    - cron: '0 23 * * *'  # 每天 23:00 UTC = 北京时间 07:00
  workflow_dispatch:
    inputs:
      stocks:
        description: '自选股JSON (可选, 覆盖默认)'
        required: false
        default: ''
      extra_keywords:
        description: '额外关键词 逗号分隔'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Prepare config from inputs
        run: |
          if [ -n "${{ inputs.stocks }}" ]; then
            echo '${{ inputs.stocks }}' > config/watchlist.json
            echo "Updated watchlist from manual input"
            cat config/watchlist.json
          fi
          if [ -n "${{ inputs.extra_keywords }}" ]; then
            echo "${{ inputs.extra_keywords }}" | tr ',' '\n' >> config/keywords_comprehensive.txt
            echo "Added extra keywords"
          fi

      - name: Generate report
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODELSCOPE_BASE_URL: ${{ secrets.MODELSCOPE_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: |
          python src/generate_report.py
          ls -lh docs/data/

      - name: Commit & Push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/models.json docs/data/history/
          git diff --staged --quiet || git commit -m "chore: daily report $(date +'%Y-%m-%d %H:%M') [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
